<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Website Data</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Update Website Data</h1>
        <form id="updateForm">
            <label for="htmlData">HTML Data:</label>
            <textarea id="htmlData" rows="5" cols="30"></textarea>
            <br>
            <label for="cssData">CSS Data:</label>
            <textarea id="cssData" rows="5" cols="30"></textarea>
            <br>
            <label for="jsData">JavaScript Data:</label>
            <textarea id="jsData" rows="5" cols="30"></textarea>
            <br>
            <button type="submit">Update</button>
        </form>
        <div id="message"></div>
    </div>
    <script src="update-website.js"></script>
</body>
</html>
